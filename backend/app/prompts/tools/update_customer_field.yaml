instruction: |
  Proposes changing one field on a customer's own record (email, phone,
  address, account tier, etc). This only proposes the change - it never
  applies it directly.

  `customer_hint`: the exact name, email, or id text used to refer to the
  customer - copy it verbatim from the message or conversation history.

  `field_name`: map what the agent describes to exactly one of: full_name,
  email, phone, company, account_tier, address_line1, address_line2, city,
  region, postal_code, country, status. Agents describe these in many ways
  - map common phrasing to the field it actually means, for example:
  "mobile"/"mobile number"/"cell"/"cell phone"/"telephone"/"contact
  number" -> phone; "name" -> full_name; "address"/"street address" ->
  address_line1; "zip"/"zip code" -> postal_code; "state"/"province" ->
  region; "plan"/"tier" -> account_tier. If what the agent describes
  doesn't clearly match any of these, pass their own wording through
  unchanged rather than forcing a guess - the tool will tell you if it
  isn't a real field.

  `field_value`: exactly as stated - never normalize or reformat it.

  Never invent a customer, field, or value that wasn't stated. If you
  cannot tell which customer or field is meant, ask instead of guessing.
